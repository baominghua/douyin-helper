<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>抖音助手</title>
  <link rel="stylesheet" href="float.css" />
</head>
<body>
  <div class="panel">
    <header class="bar">
      <span class="dot" id="dot"></span>
      <span class="name">抖音助手</span>
      <div class="ops">
        <button id="btnWatch" class="op" title="暂停自动监听">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
            <circle cx="8" cy="8" r="5.2" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="8" cy="8" r="2" fill="currentColor"/>
          </svg>
        </button>
        <button id="btnMain" class="op" title="打开完整窗口">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
            <rect x="2.4" y="2.4" width="11.2" height="11.2" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <path d="M6.2 2.4v11.2" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </button>
        <button id="btnHide" class="op close" title="收进托盘">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="entry">
      <input id="inp" type="text" spellcheck="false" placeholder="粘贴链接，回车下载" />
      <button id="go" class="go" title="开始下载">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
          <path d="M8 3.4v8.2M4.6 8.2 8 11.6l3.4-3.4" fill="none" stroke="currentColor"
                stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="task" id="task">
      <div class="shot" id="shot">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M14.6 3h2.5c.3 1.9 1.6 3.4 3.9 3.6v2.6c-1.5 0-2.9-.4-3.9-1.2v6.6a5.7 5.7 0 1 1-5.7-5.7c.3 0 .6 0 .9.1v2.7a3 3 0 1 0 2.1 2.9V3z"/>
        </svg>
      </div>
      <div class="info">
        <div class="line1" id="line1">等待复制链接</div>
        <div class="line2" id="line2">自动监听已开启</div>
      </div>
    </div>

    <div class="track"><i id="fill"></i></div>
  </div>

  <script src="float.js"></script>
</body>
</html>
