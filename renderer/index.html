<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>抖音下载助手</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="titlebar">
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path fill="#FE2C55" d="M14.6 3h2.5c.3 1.9 1.6 3.4 3.9 3.6v2.6c-1.5 0-2.9-.4-3.9-1.2v6.6a5.7 5.7 0 1 1-5.7-5.7c.3 0 .6 0 .9.1v2.7a3 3 0 1 0 2.1 2.9V3z"/>
        </svg>
      </span>
      <span class="title">抖音下载助手</span>
    </div>
    <div class="win-actions">
      <button id="btnMin" class="win-btn" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <button id="btnClose" class="win-btn close" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 12 12" width="12" height="12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <main class="main">
    <section class="hero">
      <h1>在抖音里复制，这边就下好</h1>
      <p>开着监听时，抖音客户端里点「分享 → 复制链接」，这里自动开始；也可以手动粘贴</p>
    </section>

    <section class="input-card">
      <textarea id="input" spellcheck="false"
        placeholder="例如：7.68 复制打开抖音，看看【某某的作品】…  https://v.douyin.com/xxxxxxx/"></textarea>
      <div class="input-bar">
        <button id="btnPaste" class="ghost">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M6 2.5h4M6.5 1.5h3a1 1 0 0 1 1 1v1h-5v-1a1 1 0 0 1 1-1z" stroke="currentColor" fill="none" stroke-width="1.2"/><path d="M4.5 3.5h-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1" stroke="currentColor" fill="none" stroke-width="1.2" stroke-linecap="round"/></svg>
          粘贴
        </button>
        <span class="hint" id="hint">Ctrl + V 也能直接粘</span>
        <button id="btnParse" class="primary">
          <span>开始解析</span>
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 8h9M8.5 4l4 4-4 4" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </section>

    <section class="results" id="results"></section>

    <section class="empty" id="empty">
      <div class="empty-art">
        <svg viewBox="0 0 120 90" width="120" height="90" aria-hidden="true">
          <rect x="14" y="18" width="92" height="58" rx="10" fill="#fff" stroke="#E4E6EB" stroke-width="1.5"/>
          <rect x="26" y="30" width="34" height="34" rx="6" fill="#FFF1F4"/>
          <path d="M32 58l7-8 5 5 4-4 6 7z" fill="#FE2C55" opacity=".55"/>
          <circle cx="50" cy="39" r="3" fill="#FE2C55" opacity=".8"/>
          <rect x="68" y="32" width="26" height="5" rx="2.5" fill="#E9EBEF"/>
          <rect x="68" y="43" width="20" height="5" rx="2.5" fill="#E9EBEF"/>
          <rect x="68" y="54" width="24" height="5" rx="2.5" fill="#E9EBEF"/>
          <circle cx="97" cy="20" r="9" fill="#00E5DC" opacity=".18"/>
        </svg>
      </div>
      <p class="empty-t">还没有任务</p>
      <p class="empty-s">在抖音里复制链接就会自动出现在这里，也可以在上面手动粘贴</p>
    </section>
  </main>

  <footer class="statusbar">
    <button id="btnDir" class="path" title="点击打开文件夹">
      <svg viewBox="0 0 16 16" width="13" height="13"><path d="M1.8 4.6a1 1 0 0 1 1-1h3l1.4 1.6h5.9a1 1 0 0 1 1 1v5.9a1 1 0 0 1-1 1H2.8a1 1 0 0 1-1-1z" stroke="currentColor" fill="none" stroke-width="1.2"/></svg>
      <span id="dirText">读取中…</span>
    </button>
    <div class="status-right">
      <label class="switch" title="在抖音客户端里复制链接，自动开始下载">
        <input type="checkbox" id="watchClip" checked />
        <span>监听剪贴板</span>
      </label>
      <label class="switch" title="在抖音客户端窗口旁边显示小条">
        <input type="checkbox" id="floatOn" checked />
        <span>桌面悬浮条</span>
      </label>
      <label class="switch" title="解析完自动开始下载">
        <input type="checkbox" id="autoDl" checked />
        <span>自动下载</span>
      </label>
      <button id="btnChangeDir" class="ghost small">更换目录</button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
